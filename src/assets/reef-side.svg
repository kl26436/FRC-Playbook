<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-label="Side view of a reef face showing how a staged algae blocks the L2 and L3 branches while L4 stays open">
<style>
  .bg { fill: #ffffff; }
