  .coral-ok { fill: #ffffff; stroke: #1c7c54; stroke-width: 2; }
  .coral-no { fill: none; stroke: #c23b33; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .alg-ball { fill: #0b7f74; fill-opacity: 0.9; }
</style>
