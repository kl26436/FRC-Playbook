<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept robot, interactive model</title>
<style>
/* Layout idea: an engineering brief. One reading column with wide figures; colour comes from the field itself
   (violet reef pipes, teal algae, blue alliance) and is used only where it carries meaning. */
:root {
  --bg: #eef1f3; --surface: #ffffff; --ink: #0f2029; --muted: #55646e; --line: #d3dae0;
  --accent: #0b7f74; --violet: #7a3ea3; --blue: #1846b8; --red: #c23b33; --amber: #a86a12;
  --good: #1c7c54; --bad: #c23b33;
  --r1: #cf6a0a; --r2: #2a8a3b; --r3: #bd2278;
  --viewer-bg: #dde4e9; --viewer-floor: #4b525a; --field: #e3e8ec;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d171d; --surface: #14222b; --ink: #e5edf1; --muted: #9aaab4; --line: #273843;
    --accent: #3cc9ba; --violet: #b98be0; --blue: #7099f5; --red: #f0776d; --amber: #e3b341;
    --good: #4fc08d; --bad: #f0776d;
    --r1: #f59e42; --r2: #5fc272; --r3: #ee6bb0;
    --viewer-bg: #111e26; --viewer-floor: #2a3239; --field: #1a2a34;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d171d; --surface: #14222b; --ink: #e5edf1; --muted: #9aaab4; --line: #273843;
  --accent: #3cc9ba; --violet: #b98be0; --blue: #7099f5; --red: #f0776d; --amber: #e3b341;
  --good: #4fc08d; --bad: #f0776d;
  --r1: #f59e42; --r2: #5fc272; --r3: #ee6bb0;
  --viewer-bg: #111e26; --viewer-floor: #2a3239; --field: #1a2a34;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 72px; }
.col { max-width: 68ch; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.05; margin: 0; letter-spacing: 0.01em; }
h1 { font-size: clamp(2.6rem, 7vw, 4.4rem); font-weight: 700; text-transform: uppercase; }
h2 { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 700; text-transform: uppercase; }
h3 { font-size: 1.35rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, .tiles strong, .readout b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header.top { padding: 44px 0 26px; display: grid; gap: 16px; }
.eyebrow { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 1.18rem; max-width: 60ch; }
.note { border-left: 4px solid var(--amber); background: var(--surface); padding: 14px 16px; max-width: 78ch; font-size: 0.95rem; }
.note strong { color: var(--amber); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 22px 0 8px; }
.tiles div { background: var(--surface); padding: 14px 14px 12px; display: grid; gap: 4px; align-content: start; }
.tiles strong { font-size: 1.7rem; font-weight: 500; line-height: 1; }
.tiles span { font-size: 0.84rem; color: var(--muted); line-height: 1.3; }

nav.toc { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: var(--font-display); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.04em; }
nav.toc a { color: var(--ink); text-decoration: none; }
nav.toc a:hover { color: var(--accent); }

section { padding-top: 54px; display: grid; gap: 20px; }
section > .kicker { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: -12px; }
ul, ol { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
li::marker { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.card h3 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card p, .card li { font-size: 0.95rem; }
.tag { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border: 1px solid currentColor; border-radius: 2px; white-space: nowrap; }
.tag.must { color: var(--good); } .tag.should { color: var(--amber); } .tag.could { color: var(--muted); }
.rule { font-family: var(--font-mono); font-size: 0.82em; color: var(--muted); white-space: nowrap; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-family: var(--font-display); font-size: 1.02rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.hl td { background: color-mix(in srgb, var(--accent) 9%, transparent); }

figure { margin: 0; display: grid; gap: 10px; }
figcaption { font-size: 0.9rem; color: var(--muted); max-width: 78ch; }
.figbox { background: var(--surface); border: 1px solid var(--line); padding: 12px; overflow-x: auto; }
.fig-svg { display: block; width: 100%; height: auto; min-width: 560px; color: var(--ink); font-family: var(--font-body); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.86rem; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 4px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.legend i.dot { width: 10px; height: 10px; border-radius: 50%; }

/* diagram classes */
.carpet { fill: var(--field); }
.rail { stroke: currentColor; stroke-width: 2; }
.wall-blue { stroke: var(--blue); stroke-width: 4; }
.station { stroke: var(--blue); stroke-width: 4; stroke-linecap: round; }
.proc { fill: var(--blue); }
.truss { fill: currentColor; opacity: 0.16; }
.centre { stroke: currentColor; stroke-width: 0.6; stroke-dasharray: 3 3; opacity: 0.5; }
.zone-blue { fill: none; stroke: var(--blue); stroke-width: 1.4; }
.zone-red { fill: none; stroke: var(--red); stroke-width: 1.4; opacity: 0.75; }
.cage-blue { fill: var(--blue); } .cage-red { fill: var(--red); opacity: 0.75; }
.startline { stroke: currentColor; stroke-width: 2; }
.reefzone { fill: none; stroke: var(--blue); stroke-width: 1.2; stroke-dasharray: 4 3; }
.reef { fill: color-mix(in srgb, var(--violet) 16%, var(--field)); stroke: var(--violet); stroke-width: 1.6; }
.branch { fill: var(--violet); }
.alg-lo { fill: var(--accent); opacity: 0.85; }
.alg-hi { fill: none; stroke: var(--accent); stroke-width: 2.2; }
.coral-dot { fill: var(--surface); stroke: currentColor; stroke-width: 0.8; }
.t { font-size: 7.4px; fill: currentColor; opacity: 0.82; }
.t-dim { font-size: 6.6px; fill: currentColor; opacity: 0.62; }
.t-strong { font-size: 8px; font-weight: 600; fill: currentColor; letter-spacing: 0.04em; }
.t-branch { font-size: 7.6px; font-weight: 600; fill: var(--violet); }
.t-tag { font-size: 6px; fill: currentColor; opacity: 0.6; font-family: var(--font-mono); }
.t-num { font-size: 7px; font-weight: 600; fill: #fff; }
.scale { stroke: currentColor; stroke-width: 1; }
.bot { fill: none; stroke-width: 1.4; stroke-dasharray: 3 2; }
.r1 { fill: none; stroke: var(--r1); stroke-width: 2.2; } .r1f, .r1n { fill: var(--r1); } .r1s { stroke: var(--r1); }
.r2 { fill: none; stroke: var(--r2); stroke-width: 2.2; } .r2f, .r2n { fill: var(--r2); } .r2s { stroke: var(--r2); }
.r3 { fill: none; stroke: var(--r3); stroke-width: 2.2; } .r3f, .r3n { fill: var(--r3); } .r3s { stroke: var(--r3); }
.reef-svg .t { font-size: 11px; } .reef-svg .t-strong { font-size: 12.5px; }
.carpet-line { stroke: currentColor; stroke-width: 1.5; }
.lvl { stroke: currentColor; stroke-width: 0.6; stroke-dasharray: 2 4; opacity: 0.45; }
.bump { fill: var(--blue); } .frame { fill: currentColor; opacity: 0.3; }
.reefbase { fill: currentColor; opacity: 0.78; }
.pipe { stroke: var(--violet); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.coral-ok { fill: var(--surface); stroke: var(--good); stroke-width: 2; }
.coral-no { fill: none; stroke: var(--bad); stroke-width: 1.6; stroke-dasharray: 4 3; }
.alg-ball { fill: var(--accent); opacity: 0.5; stroke: var(--accent); stroke-width: 1.5; }
.t-alg { font-size: 9px; font-weight: 600; fill: currentColor; letter-spacing: 0.06em; }
.t-ok { font-size: 11px; font-weight: 600; fill: var(--good); } .t-no { font-size: 11px; font-weight: 600; fill: var(--bad); }

/* renders */
.renders { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.renders figure:first-child { grid-column: 1 / -1; }
.renders figure { align-content: start; }
.renders img { display: block; width: 100%; height: auto; max-width: 100%; border: 1px solid var(--line); background: var(--surface); }
@media (max-width: 640px) { .renders { grid-template-columns: 1fr; } }

/* 3D viewer */
.viewer { border: 1px solid var(--line); background: var(--surface); display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
.viewer-main { display: grid; grid-template-rows: auto 1fr; min-width: 0; border-right: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
.bar .lbl { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); align-self: center; margin-right: 4px; }
button.chip { font: inherit; font-size: 0.86rem; padding: 6px 11px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; border-radius: 2px; }
button.chip:hover { border-color: var(--accent); }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.stage { position: relative; background: var(--viewer-bg); min-height: 0; }
#rb-canvas { display: block; width: 100%; height: clamp(360px, 62vh, 620px); touch-action: pan-y; cursor: grab; }
#rb-canvas:active { cursor: grabbing; }
.readout { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.readout span { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); padding: 4px 8px; font-size: 0.78rem; color: var(--muted); }
.readout b { color: var(--ink); font-weight: 500; }
.hint { position: absolute; right: 10px; top: 10px; font-size: 0.76rem; color: var(--muted); background: color-mix(in srgb, var(--surface) 80%, transparent); padding: 3px 7px; pointer-events: none; }
.side { padding: 12px; display: grid; gap: 14px; align-content: start; }
.side h4 { margin: 0 0 6px; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.side .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.side label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; }
.side .toggles { display: grid; gap: 6px; }
.info { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; font-size: 0.9rem; }
.info strong { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.fallback { padding: 18px; font-size: 0.95rem; }
@media (max-width: 860px) { .viewer { grid-template-columns: 1fr; } .viewer-main { border-right: 0; border-bottom: 1px solid var(--line); } }

.steps { counter-reset: s; list-style: none; padding: 0; gap: 10px; }
.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); padding: 12px 14px 12px 54px; position: relative; }
.steps li::before { content: counter(s); position: absolute; left: 14px; top: 8px; font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; color: var(--accent); }
.steps li b { font-weight: 600; }
footer { margin-top: 60px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 0.88rem; color: var(--muted); display: grid; gap: 8px; max-width: 80ch; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* v3: part breaks, build timeline, Robot A viewer extras */
[hidden] { display: none !important; }
.toc-part { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); align-self: center; }
.partbreak { margin-top: 64px; padding: 26px 0 6px; border-top: 4px solid var(--ink); display: grid; gap: 14px; }
.partbreak .kicker { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.partbreak h2 { font-size: clamp(2.2rem, 5.5vw, 3.4rem); }
.journey { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; min-width: 0; }
.journey:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.jstep { flex: 0 0 min(560px, 86%); scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.jstep p, .jstep li { font-size: 0.95rem; }
.jday { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.jnav { display: flex; align-items: center; gap: 12px; }
.jcount { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }
#ra-canvas { display: block; width: 100%; height: clamp(380px, 66vh, 660px); touch-action: pan-y; cursor: grab; }
.sliders { display: grid; gap: 10px; }
.sl { display: grid !important; gap: 2px; font-size: 0.86rem; }
.sl span { display: flex; justify-content: space-between; color: var(--muted); }
.sl b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); }
.sl input { width: 100%; accent-color: var(--accent); }
.keep { font-size: 0.85rem; padding: 8px 10px; border-left: 4px solid var(--good); background: color-mix(in srgb, var(--good) 8%, transparent); }
.keep.bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.keep b { font-weight: 600; }
.bars { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; }
.wrow { display: grid; grid-template-columns: minmax(110px, 220px) 1fr 56px; gap: 10px; align-items: center; font-size: 0.9rem; }
.wt { height: 14px; background: color-mix(in srgb, var(--line) 60%, transparent); position: relative; }
.wt i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.wv { text-align: right; }
.wsum { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; }
.progress { position: relative; height: 26px; background: var(--surface); border: 1px solid var(--line); }
.progress div { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 35%, transparent); }
.progress span { position: relative; padding: 0 10px; line-height: 26px; font-family: var(--font-mono); font-size: 0.82rem; }

html, body { margin: 0; padding: 0; background: var(--surface); }
body { font-family: var(--font-body); color: var(--ink); font-size: 16px; line-height: 1.5; }
.viewer { margin: 0; }
#rb-canvas, #rb-canvas-b { display: block; width: 100%; height: 440px; touch-action: pan-y; cursor: grab; }
#rb-canvas-b:active { cursor: grabbing; }

</style>
</head>
<body>
  <div class="viewer" id="viewer">
    <div class="viewer-main">
      <div class="bar" role="group" aria-label="Robot pose">
        <span class="lbl">Pose</span>
        <button class="chip" data-pose="start" aria-pressed="true">Start</button>
        <button class="chip" data-pose="station" aria-pressed="false">Station</button>
        <button class="chip" data-pose="l2" aria-pressed="false">L2</button>
        <button class="chip" data-pose="l3" aria-pressed="false">L3</button>
        <button class="chip" data-pose="l4" aria-pressed="false">L4</button>
        <button class="chip" data-pose="algae" aria-pressed="false">Algae</button>
        <button class="chip" data-pose="processor" aria-pressed="false">Processor</button>
        <button class="chip" data-pose="net" aria-pressed="false">Net</button>
        <button class="chip" data-pose="climb" aria-pressed="false">Climb</button>
      </div>
      <div class="stage">
        <canvas id="rb-canvas" aria-label="Interactive 3D model of the concept robot"></canvas>
        <div class="hint">drag to orbit &middot; scroll or pinch to zoom</div>
        <div class="readout" id="readout"></div>
      </div>
    </div>
    <div class="side">
      <div>
        <h4>Show one subsystem</h4>
        <div class="chips" role="group" aria-label="Subsystem">
          <button class="chip" data-sub="" aria-pressed="true">Whole robot</button>
          <button class="chip" data-sub="drive" aria-pressed="false">Drivebase</button>
          <button class="chip" data-sub="elev" aria-pressed="false">Elevator</button>
          <button class="chip" data-sub="coral" aria-pressed="false">Coral wrist</button>
          <button class="chip" data-sub="algae" aria-pressed="false">Algae claw</button>
          <button class="chip" data-sub="funnel" aria-pressed="false">Funnel</button>
          <button class="chip" data-sub="climb" aria-pressed="false">Climber</button>
          <button class="chip" data-sub="vision" aria-pressed="false">Vision</button>
        </div>
      </div>
      <div class="toggles">
        <h4>View</h4>
        <label><input type="checkbox" id="tg-explode"> Pull subsystems apart</label>
        <label><input type="checkbox" id="tg-env"> Show rule envelopes</label>
        <label><input type="checkbox" id="tg-field" checked> Show field elements</label>
        <div class="chips" role="group" aria-label="Camera">
          <button class="chip" data-view="38,70">3/4</button>
          <button class="chip" data-view="90,86">Side</button>
          <button class="chip" data-view="0,86">Front</button>
          <button class="chip" data-view="38,12">Top</button>
        </div>
      </div>
      <div class="info" id="info" aria-live="polite"></div>
    </div>
  </div>
<script src="three.min.js"></script>
<script>
/* REEFSCAPE kickoff concept robot. Units are inches. X forward (toward the reef), Y up, Z to the robot's right. */
(function () {
  'use strict';
  var D2R = Math.PI / 180;

  function buildViewer(canvas, opts) {
    opts = opts || {};
    var CONCEPT_B = opts.concept === 'B';
    var T = window.THREE;
    var renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: !!opts.preserve });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;

    var scene = new T.Scene();
    var camera = new T.PerspectiveCamera(30, 1, 2, 3000);

    var hemi = new T.HemisphereLight(0xffffff, 0x6f757c, 0.78);
    scene.add(hemi);
    var sun = new T.DirectionalLight(0xffffff, 1.25);
    sun.position.set(70, 190, 110);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -90; sun.shadow.camera.right = 90;
    sun.shadow.camera.top = 150; sun.shadow.camera.bottom = -40;
    sun.shadow.camera.near = 10; sun.shadow.camera.far = 500;
    sun.shadow.bias = -0.0015;
    scene.add(sun);
    var fill = new T.DirectionalLight(0xdfe8ff, 0.35);
    fill.position.set(-120, 60, -80);
    scene.add(fill);

    /* ---------- materials ---------- */
    function mk(name, color, o) {
      var m = new T.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.6, metalness: 0.1 }, o || {}));
      m.name = name;
      return m;
    }
    var M = {
      alu: mk('alu', 0xc6cbd0, { metalness: 0.75, roughness: 0.42 }),
      aluDark: mk('alu_black', 0x24282d, { metalness: 0.55, roughness: 0.48 }),
      steel: mk('steel', 0x9aa1a8, { metalness: 0.85, roughness: 0.32 }),
      pan: mk('belly_pan', 0x30353a, { metalness: 0.3, roughness: 0.6 }),
      poly: mk('polycarbonate', 0xcfe2ec, { transparent: true, opacity: 0.38, roughness: 0.12, metalness: 0.0, side: T.DoubleSide }),
      bumper: mk('bumper_blue', 0x1846b8, { roughness: 0.92, metalness: 0 }),
      rubber: mk('rubber', 0x17181a, { roughness: 0.95, metalness: 0 }),
