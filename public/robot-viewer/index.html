<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The robot in 3D</title>
<style>
:root {
  --bg: #ffffff; --surface: #ffffff; --ink: #0f2029; --muted: #55646e; --line: #d3dae0;
  --accent: #0b7f74; --good: #1c7c54; --bad: #c23b33; --pick: #cf6a0a;
  --viewer-bg: #dde4e9; --viewer-floor: #4b525a;
  --font-body: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
:root[data-theme="dark"] {
  --bg: #17181c; --surface: #1f2126; --ink: #e5edf1; --muted: #9aaab4; --line: #353841;
  --accent: #3cc9ba; --good: #4fc08d; --bad: #f0776d; --pick: #f59e42;
  --viewer-bg: #111e26; --viewer-floor: #2a3239; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
p, h3 { margin: 0; }
h3 { font-size: 1.05rem; line-height: 1.25; }
button, select, input { font: inherit; }
button, select { font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 5px 11px; cursor: pointer; min-height: 36px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.stage { position: relative; background: var(--viewer-bg); }
#view { display: block; width: 100%; height: clamp(340px, 62vh, 620px); touch-action: pan-y; cursor: grab; }
.mode-part #view { height: 340px; }
.mode-replay #view { height: 400px; }
.mode-replay.has-field #view { height: clamp(300px, 60vw, 560px); }
.mode-keepout #view { height: clamp(300px, 46vh, 460px); }
.mode-assemble #view { height: 360px; }
@media (max-width: 520px) { .mode-assemble #view { height: 250px; } }
.mode-assemble .readout { display: none; }
.asbar { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); }
.asbar strong { font-size: 1rem; line-height: 1.25; }
.asbar .sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.asbar button:disabled { opacity: 0.4; cursor: default; }
.asbar .mid { display: grid; gap: 1px; text-align: center; }
.asbar .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dotkey i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 4px 0 10px; }
.hint, .readout { position: absolute; left: 10px; right: 10px; font-size: 12.5px; color: var(--ink); pointer-events: none; text-shadow: 0 0 4px var(--viewer-bg), 0 0 4px var(--viewer-bg); }
.hint { bottom: 8px; }
.readout { top: 8px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-variant-numeric: tabular-nums; }
.mode-part .readout { display: none; }
.fallback { padding: 24px; }
.panel { padding: 12px; display: grid; gap: 12px; border-top: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.row > .lab { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); flex: 0 0 100%; }
#subs label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 4px; min-height: 36px; cursor: pointer; }
#subs i { width: 10px; height: 10px; border-radius: 50%; display: none; }
.bysub #subs i { display: inline-block; }
.slide { display: inline-flex; align-items: center; gap: 8px; flex: 1 1 220px; }
.slide input { flex: 1; min-width: 100px; }
.check { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; }
#picked { border: 1px solid var(--line); border-left: 4px solid var(--pick); border-radius: 4px; padding: 10px 12px; display: grid; gap: 6px; }
.tag { justify-self: start; font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--c); }
.facts { font-size: 14px; }
.go { display: inline-block; font-weight: 600; padding: 6px 0; }
#find { width: 100%; max-width: 420px; }
.keepwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.keepwrap .stage { border-right: 1px solid var(--line); }
.mode-keepout .keepwrap #view { height: 100%; min-height: 360px; }
.chartbox { padding: 10px 10px 0; }
#chart { display: block; width: 100%; height: 340px; touch-action: none; cursor: crosshair; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); padding: 4px 4px 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
.legend .sw { border-radius: 2px; background: var(--bad); opacity: 0.3; }
.keep { border-left: 4px solid var(--good); padding: 8px 12px; background: var(--surface); border-radius: 0 4px 4px 0; }
.keep.bad { border-left-color: var(--bad); }
.keep.bad b { color: var(--bad); }
.keep.ok b { color: var(--good); }
.num { font-variant-numeric: tabular-nums; min-width: 4.2em; text-align: right; }
@media (max-width: 720px) { .keepwrap { grid-template-columns: 1fr; } .keepwrap .stage { border-right: 0; border-bottom: 1px solid var(--line); } .mode-keepout .keepwrap #view { height: 300px; min-height: 0; } #chart { height: 300px; } }
.only-explore, .only-part, .only-keepout, .only-assemble { display: none; }
.mode-explore .only-explore, .mode-part .only-part, .mode-keepout .only-keepout, .mode-assemble .only-assemble { display: grid; }
.mode-keepout .keepwrap { display: grid; }
body:not(.mode-keepout) .chartbox { display: none; }
body:not(.mode-keepout) .keepwrap { display: block; }
</style>
</head>
<body>
<div class="keepwrap">
  <div class="stage">
    <canvas id="view" aria-label="Interactive 3D model of the robot, from the final CAD"></canvas>
    <div class="readout" id="readout"></div>
    <div class="hint" id="hint">Loading the model&hellip;</div>
  </div>
  <div class="chartbox">
    <canvas id="chart" aria-label="Chart of carriage height against wrist angle, showing which poses are allowed"></canvas>
    <div class="legend">
      <span><i style="background:var(--good)"></i>Tested on the CAD: clear</span>
      <span><i style="background:var(--bad)"></i>Tested on the CAD: something hits</span>
      <span><i class="sw"></i>The code will not go here</span>
    </div>
  </div>
</div>

<div class="panel only-explore">
  <div id="picked" aria-live="polite"></div>
  <select id="find" aria-label="Find a made part on the robot"></select>
  <div class="row"><span class="lab">Put the robot in a pose</span><div class="row" id="poses"></div></div>
  <p class="muted" id="posetext"></p>
  <div class="row"><span class="lab">Show or hide a subsystem</span><div class="row" id="subs"></div></div>
  <div class="row">
    <label class="slide"><span>Pull the subsystems apart</span><input type="range" id="apart" min="0" max="1" step="0.01" value="0"></label>
    <label class="check"><input type="checkbox" id="bysub"> Colour by subsystem</label>
  </div>
</div>

<div class="asbar only-assemble">
  <button type="button" id="as-prev" aria-label="Previous step">&#9664; Back</button>
  <div class="mid"><strong id="as-title">Loading the steps&hellip;</strong><span class="n" id="as-count"></span></div>
  <button type="button" id="as-next" aria-label="Next step">Next &#9654;</button>
  <div class="sub"><span id="as-what"></span><span class="dotkey"><i style="background:#ff7a1a"></i>new part<i style="background:#e6007e"></i>new fastener<i style="background:#2b2f36"></i>fastener already in</span></div>
</div>

<div class="panel only-part">
  <div class="row">
    <button type="button" data-show="alone" aria-pressed="true">The part alone</button>
    <button type="button" data-show="place" aria-pressed="false">Where it sits on the robot</button>
  </div>
</div>

<div class="panel only-keepout">
  <div class="keep" id="keepstate" aria-live="polite"></div>
  <div class="row">
    <label class="slide"><span>Carriage</span><input type="range" id="s-c" min="0" max="66" step="0.25" value="8"><span class="num" id="v-c"></span></label>
    <label class="slide"><span>Wrist</span><input type="range" id="s-th" min="-90" max="75" step="1" value="-30"><span class="num" id="v-th"></span></label>
  </div>
  <div class="row"><span class="lab">Try these</span>
    <button type="button" data-try="0,-90">Stowed</button>
    <button type="button" data-try="5,-90">Lift 5 in while stowed</button>
    <button type="button" data-try="1.25,-35">Swing out at 1.25 in</button>
    <button type="button" data-try="12,-60">Wrist too low at 12 in</button>
    <button type="button" data-try="17.5,-35">L2</button>
    <button type="button" data-try="66,-52.8">L4</button>
  </div>
</div>

<script src="../concept-viewer/three.min.js"></script>
<script src="field.js"></script>
<script src="viewer.js"></script>
</body>
</html>
